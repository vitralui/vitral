        <!--
            Google Analytics, on the published site only: the prerender runs
            every page in headless Chrome against a local server, and a build
            must not count as a few hundred readers. The same guard keeps
            `pnpm dev` out of the figures.
        -->
        <script>
            (function () {
                if (location.hostname !== 'vitralui.github.io') return;
                var tag = document.createElement('script');
                tag.async = true;
                tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-RT0C0DFT1C';
                document.head.appendChild(tag);
                window.dataLayer = window.dataLayer || [];
                window.gtag = function () {
                    window.dataLayer.push(arguments);
                };
                gtag('js', new Date());
                gtag('config', 'G-RT0C0DFT1C');
            })();
        </script>
        <script>
            // The scheme before the first paint: the prerendered pages are light,
            // and a reader whose choice (or system) says dark should not see them.
            (function () {
                try {
                    var pinned = new URLSearchParams(location.search).get('scheme');
                    var scheme = pinned === 'light' || pinned === 'dark' ? pinned : localStorage.getItem('vitral-docs-scheme') || 'system';
                    var dark = scheme === 'dark' || (scheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
                    document.documentElement.classList.toggle('vt-dark', dark);
                } catch (error) {
                    /* storage blocked: the application sorts it out on mount */
                }
            })();

            // The direction, for the same reason and before the same paint: the
            // prerendered pages are left to right, and a reader who asked for
            // right to left should not watch the page turn over on hydration.
            (function () {
                try {
                    var pinned = new URLSearchParams(location.search).get('dir');
                    var dir = pinned === 'rtl' || pinned === 'ltr' ? pinned : localStorage.getItem('vitral-docs-direction');
                    if (dir === 'rtl') document.documentElement.dir = 'rtl';
                } catch (error) {
                    /* storage blocked: the application sorts it out on mount */
                }
            })();
        </script>
